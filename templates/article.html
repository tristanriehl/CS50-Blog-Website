{% extends "layout.html" %}

{% block title %}
{{ article.title }}
{% endblock %}

{% block main %}
<div class="mx-auto" style="max-width: 700px;">
    <h2>{{ article.title }}</h2>
    <p class="text-muted">
        by {{ article.author }} &middot; {{ article.created_at.strftime('%b %d, %Y %I:%M %p') }}
    </p>
    <hr>
    <div class="text-start" style="white-space: pre-line;">
        {{ article.content }}
    </div>
</div>
{% endblock %}
